[project]
name = "campusgrid-backend"
version = "0.1.0"
description = "Autonomous Multi-Agent Microgrid Energy Management System & Cyber-Physical Digital Twin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "sqlmodel>=0.0.19",
    "pulp>=2.8.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "spacy>=3.7.4",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.3.0",
    "langgraph>=0.1.5",
    "litellm>=1.40.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
