<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CampusGrid AI — campus energy planning assistant" />
    <title>CampusGrid AI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23256abf'/%3E%3Crect x='7' y='11' width='16' height='10' rx='2' fill='none' stroke='white' stroke-width='2'/%3E%3Crect x='24' y='14' width='2' height='4' rx='1' fill='white'/%3E%3Cpath d='M16 12.5l-3 4h3l-1 3.5 3-4.5h-3z' fill='white'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('cg-theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
