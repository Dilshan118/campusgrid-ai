[project]
name = "campusgrid-ai"
version = "4.2.0"
description = "Autonomous Multi-Agent Microgrid Energy Management System & Cyber-Physical Digital Twin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "sqlmodel>=0.0.19",
    "sqlalchemy>=2.0.30",
    "pulp>=2.8.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "litellm>=1.40.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
