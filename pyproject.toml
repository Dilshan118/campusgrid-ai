[project]
name = "campusgrid-ai"
version = "4.2.0"
description = "Autonomous Multi-Agent Microgrid Energy Management System & Cyber-Physical Digital Twin"
readme = "README.md"
requires-python = ">=3.10"

# Core runtime: everything needed to boot the API and run the full test suite
# with mock LLM / mock embedding / in-memory providers. Deliberately lightweight
# so CI stays fast and no developer is forced to download torch to run tests.
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "python-dotenv>=1.0.1",
    "sqlmodel>=0.0.19",
    "sqlalchemy>=2.0.30",
    "pulp>=2.8.0",
    "litellm>=1.40.0",
]

[project.optional-dependencies]
# Neon / PostgreSQL + pgvector. The pgvector extension is server-side; the
# client only needs a DBAPI driver because queries are issued as raw SQL.
postgres = [
    "psycopg2-binary>=2.9.9",
]

# Real semantic retrieval and the offline document-ingestion pipeline.
# Pulls torch via sentence-transformers, so it is opt-in.
rag = [
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "pypdf>=4.2.0",
]

# Forecasting (Agent 1) and grey-box parameter fitting (Agent 2).
ml = [
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scipy>=1.13.1",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.3.0",
]

# Explicit NLP entity extraction for the orchestrator.
nlp = [
    "spacy>=3.7.4",
]

dev = [
    "pytest>=8.2.2",
    "httpx>=0.27.0",
]

# What every team member should install:  pip install -e ".[all]"
all = [
    "campusgrid-ai[postgres,rag,ml,nlp,dev]",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
