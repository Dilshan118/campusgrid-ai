name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # tests/conftest.py builds its own hermetic settings (mock LLM and embeddings, in-memory
      # stores), so no database or API key is needed. Never point CI at a shared database.
      - run: python -m pytest -q
        env:
          APP_ENV: test
          DATABASE_PROVIDER: in_memory
          VECTOR_STORE_PROVIDER: memory
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
